stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="801" y="198" width="11" height="14" rx="1" fill="#a86512" stroke="#a86512" stroke-width="1.5"/><path d="M 960 239 V 264 M 779 264 H 1098" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 779 264 V 283" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1098 264 V 283" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="650" y="283" width="257" height="48" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="778.5" y="313.0" font-size="17" font-weight="600" fill="#172b42" text-anchor="middle">Nominal behaviour</text><rect x="973" y="283" width="239" height="48" rx="12" fill="white" stroke="#a86512" stroke-width="1.5"/><text x="1092.5" y="313.0" font-size="17" font-weight="600" fill="#172b42" text-anchor="middle">Realised fault effect</text><text x="642" y="369" font-size="13.5" font-weight="400" fill="#526477" text-anchor="start">Conceptual mechanism · behaviour depends on configuration</text>
