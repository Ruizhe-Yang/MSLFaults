<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">MSLFaults</title>
<desc id="desc">A host model meets an MSL-compatible component boundary. Local activation determines whether the component exhibits nominal behaviour or a realised fault effect. These are alternative behaviours.</desc>
